<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shlong.org</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('starstwinkle2.gif') repeat;
            background-size: 390px 390px;
            overflow: hidden;
            position: relative;
            z-index:
        }

        #gif-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .gif {
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gif-container"></div>
    <div style="width: 50px; height: 50px; background-color: red;">
        
    </div>
    <script>
 
        const gifURLs = ["twinkle.gif", "twinkle1.gif"]; 

   
        function createRandomGif() {
            const container = document.getElementById("gif-container");

            // Create a new GIF element
            const gif = document.createElement("img");
            gif.src = gifURLs[Math.floor(Math.random() * gifURLs.length)]; 
            gif.className = "gif";

      
            const randomX = Math.random() * window.innerWidth;
            const randomY = Math.random() * window.innerHeight;

            gif.style.left = `${randomX}px`;
            gif.style.top = `${randomY}px`;

  
            container.appendChild(gif);

       
            setTimeout(() => {
                gif.remove();
            }, 3000); 
        }


        function generateRandomGif() {
            createRandomGif(); 

        
            setTimeout(generateRandomGif, Math.random() * 8000 + 4000);
        }

        // Start generating GIFs
        generateRandomGif();
    </script>
</body>
</html>
