<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shlong.org</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('starstwinkle2.gif') repeat;
            background-size: 390px 390px;
            overflow: hidden;
            position: relative;
        }

        .twinkle {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('') repeat;
            z-index: 1;
            pointer-events: none;
        }

        #gif-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .gif {
            position: absolute;
            width: 100px; /* Adjust size as needed */
            pointer-events: none;
            animation: fadeOut 3s forwards; /* Fade out after playing */
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="twinkle"></div>
    <div id="gif-container"></div>

    <script>
        // Paths to GIF files
        const gifURLs = ["twinkle.gif", "twinkle1.gif"]; 

        // Number of random GIFs to display
        const maxGifs = 20;

        // Function to create a random GIF element
        function createRandomGif() {
            const container = document.getElementById("gif-container");

            // Create a new GIF element
            const gif = document.createElement("img");
            gif.src = gifURLs[Math.floor(Math.random() * gifURLs.length)]; // Select random GIF
            gif.className = "gif";

            // Randomize position
            const randomX = Math.random() * window.innerWidth;
            const randomY = Math.random() * window.innerHeight;

            gif.style.left = `${randomX}px`;
            gif.style.top = `${randomY}px`;

            // Add the GIF to the container
            container.appendChild(gif);

            // Remove the GIF after it finishes playing
            setTimeout(() => {
                gif.remove();
            }, 3000); // Adjust to match GIF duration
        }

        // Function to randomly generate GIFs at intervals
        function generateRandomGifs() {
            let count = 0;

            const interval = setInterval(() => {
                if (count >= maxGifs) {
                    clearInterval(interval); // Stop after maxGifs are created
                    return;
                }

                createRandomGif();
                count++;
            }, Math.random() * 3000 + 1000); // Random interval between 1s and 4s
        }

        // Start generating GIFs
        generateRandomGifs();
    </script>
</body>
</html>
