<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shlong.org</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('logs195.jpg') repeat;
            background-size: 390px 390px;
            overflow: hidden;
            position: relative;
        }
        
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('snow01.gif') repeat;
            z-index: 1;
            pointer-events: none;
        }

        video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: auto;
            z-index: 2;
        }
        
    </style>
    </head>
<body>
    
    <div class="snowflakes"></div>
    <video id="autoplay-video" autoplay loop>
        <source src="Christmas_with_DOOM.mp4" type="video/mp4">
        Your browser does not support the video tag.
        
    </video>
    <script>
        const video = document.getElementById('autoplay-video');
        video.play().catch(error => {
            console.log('Autoplay with audio was blocked by the browser. Attempting workaround.');
            setTimeout(() => {
                video.muted = true;
                video.play().then(() => {
                    video.muted = false;
                }).catch(err => {
                    console.log('Autoplay workaround failed:', err);
                });
            }, 500);
        });
    </script>
</body>
</html>
