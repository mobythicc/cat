<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shlong.org</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('starstwinkle2.gif') repeat;
            background-size: 390px 390px;
            overflow: hidden;
            position: relative;
        }

        #gif-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1; /* Ensure it's above other elements */
        }

        .gif {
            position: absolute;
            width: 100px; /* Adjust size as needed */
            pointer-events: none;
            z-index: 9999; /* Ensure GIF is on top of everything */
        }
    </style>
</head>
<body>
    <div id="gif-container"></div>

    <script>
        // Paths to GIF files
        const gifURLs = ["twinkle.gif", "twinkle1.gif", "shootingstar.gif"]; 

        // Function to create a random GIF element
        function createRandomGif() {
            const container = document.getElementById("gif-container");

            // Create a new GIF element
            const gif = document.createElement("img");
            gif.src = gifURLs[Math.floor(Math.random() * gifURLs.length)]; // Select random GIF
            gif.className = "gif";

            // Randomize position within the viewport
            const randomX = Math.random() * (window.innerWidth - 100); // Subtract width of the GIF
            const randomY = Math.random() * (window.innerHeight - 100); // Subtract height of the GIF

            gif.style.left = `${randomX}px`;
            gif.style.top = `${randomY}px`;

            // Add the GIF to the container
            container.appendChild(gif);

            // Remove the GIF after it finishes playing
            setTimeout(() => {
                gif.remove();
            }, 3000); // Adjust to match GIF duration
        }

        // Function to randomly generate GIFs at intervals
        function generateRandomGifs() {
            // Create a new GIF every 1-4 seconds
            setInterval(createRandomGif, Math.random() * 3000 + 1000);
        }

        // Start generating GIFs
        generateRandomGifs();
    </script>
</body>
</html>
